name: Dependency Review

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - master

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 依存差分の脆弱性を検査
        id: review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-scopes: runtime, development, unknown
          license-check: false
          show-openssf-scorecard: false

      - name: 依存グラフのスナップショット警告を検査
        # 固定版は判定に使った全ページの警告を comment-content の見出しへ出す。
        # 比較を再照会すると、判定に使った応答の警告が消えている場合がある。
        if: >-
          ${{ steps.review.outputs.comment-content == '' ||
              contains(steps.review.outputs.comment-content, '<h2>Snapshot Warnings</h2>') }}
        run: |
          echo "::error::依存グラフの比較にスナップショット警告があるか、比較の要約を取得できません。警告がある場合はジョブの要約で Snapshot Warnings を確認し、依存グラフの更新後にジョブを再実行してください。要約がない場合は「依存差分の脆弱性を検査」ステップのログを確認してください。"
          exit 1
