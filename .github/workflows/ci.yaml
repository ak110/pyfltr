name: CI

on:
  push:
    tags-ignore:
      - "*"
    branches:
      - "**"
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 開発モード: DeprecationWarningなどの隠れた問題を早期検出する
  PYTHONDEVMODE: "1"
  # サプライチェーン攻撃対策: uvがlockfileを尊重する
  UV_FROZEN: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # mise・pinact等がGitHub APIを呼び出す際のレート制限（403）回避
      # container jobでは明示しないとsecrets.GITHUB_TOKENがコンテナへ渡らない
      GITHUB_TOKEN: ${{ github.token }}
      # 実行アーカイブの保存先。container job配下では$HOMEがGitHub Actionsに上書きされ
      # 不安定になるため（docker/Dockerfileの既存コメント参照）、$HOME非依存の固定絶対パスを使う。
      # 依存キャッシュ（/cache配下）とは別パスとし、actions/cacheの対象へ混入させない。
      PYFLTR_CACHE_DIR: /tmp/pyfltr-ci-archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: GitHub Actionsのピン留め検証
        run: pinact run --check

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /cache
          # 固定キーでは一度保存されると更新されないため、run_idとrun_attemptを含めて毎回保存させる。
          # /cache配下にはmiseの導入済みツール実体（MISE_DATA_DIR）が含まれるため、固定キーのままでは
          # コンテナーイメージ側でツールが更新されても復元内容が古い版のまま据え置かれ、
          # 上流ツールの変更をLinuxジョブで検知できなくなる。
          # run_idは再実行（Re-run）で変化しないため、run_attemptを併記する。
          # 上流ツールの更新で失敗した実行を再実行する場面こそキャッシュの更新が要るため、
          # run_idのみでは意図が達成されない。
          key: pyfltr-cache-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pyfltr-cache-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Test with pyfltr
        # `CI=true` を明示し、smoke test がツール不在時にスキップせず失敗扱いとなるようにする。
        env:
          CI: "true"
        run: uv run pyfltr ci --output-format=github-annotations

      - name: 失敗時に実行アーカイブを成果物として保存
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyfltr-archive-${{ runner.os }}-py${{ matrix.python-version }}
          path: ${{ env.PYFLTR_CACHE_DIR }}/runs
          retention-days: 7

      - name: Prune uv cache for CI
        run: uv cache prune --ci

  test-windows:
    runs-on: windows-latest
    env:
      # mise・pinact等がGitHub APIを呼び出す際のレート制限（403）回避。
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: latest

      - name: Configure pnpm security
        run: pnpm config set minimum-release-age 1440 --global

      - name: Configure pnpm store location
        # `pnpm store path`はcwdのドライブ（ルート）に依存して決まる。
        # チェックアウト先はDドライブ、pytestの一時ディレクトリはCドライブのため、
        # 明示しないとキャッシュ対象パスとテスト実行時の使用パスが別ドライブへ分裂し、
        # ストアが保存されないまま毎回ダウンロードが発生する。
        run: pnpm config set store-dir "${{ runner.temp }}\pnpm-store" --global

      - name: Get pnpm store path
        id: pnpm-store-win
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store-win.outputs.STORE_PATH }}
          # 固定キーでは一度保存されると更新されないため、run_idとrun_attemptを含めて毎回保存させる。
          # run_idは再実行（Re-run）で変化しないため、run_attemptを併記する。
          key: pnpm-store-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3

      - name: 実行アーカイブの保存先を設定
        # `runner`コンテキストはジョブ直下`env`から参照できないため、ステップの`run`内で
        # 解決してGITHUB_ENV経由で後続ステップへ引き渡す（Get pnpm store pathと同じ方式）。
        # 同ジョブのpnpm store設定（89-94行）と同じrunner.temp起点で、ホストランナー
        # 直接実行のため確実に利用可能。
        shell: bash
        run: echo "PYFLTR_CACHE_DIR=${{ runner.temp }}/pyfltr-cache" >> "$GITHUB_ENV"

      - name: Install smoke test tooling via mise
        # tests/smoke_test.py が起動するmise経由ツールをWindows runnerでも揃える。
        # Linux jobは公式pyfltrイメージに同梱済みのため不要。
        # 既定シェル（PowerShell）でもbash継続`\`に依存せず動くよう単一行で記述する。
        run: mise use --global shfmt@latest actionlint@latest editorconfig-checker@latest taplo@latest hadolint@latest gitleaks@latest

      - name: Install shellcheck via chocolatey
        # shellcheckはmise registryでもインストールできるが、Windowsではzip内サブディレクトリ
        # （shellcheck-vX.Y.Z\shellcheck.exe）構造に対応せず`mise exec`でバイナリを解決できない。
        # windows-latestに同梱のchocolateyで直接配置してPATH上の素のバイナリとして利用する。
        run: choco install -y shellcheck

      - name: Install smoke test tooling via uv
        # いずれもpyfltr本体依存に含まれるが、smoke testでのPATH解決を
        # 確実にするためWindows runnerへ個別に導入する。
        run: |
          uv tool install yamllint
          uv tool install typos
          uv tool install pre-commit
          uv tool install prek

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Test with pyfltr
        # `CI=true` を明示し、smoke test がツール不在時にスキップせず失敗扱いとなるようにする。
        env:
          CI: "true"
        run: uv run pyfltr ci --output-format=github-annotations

      - name: 失敗時に実行アーカイブを成果物として保存
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyfltr-archive-${{ runner.os }}
          path: ${{ env.PYFLTR_CACHE_DIR }}/runs
          retention-days: 7

      - name: Prune uv cache for CI
        run: uv cache prune --ci
