name: CI

on:
  push:
    tags-ignore:
      - "*"
    branches:
      - "**"
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 開発モード: DeprecationWarningなどの隠れた問題を早期検出する
  PYTHONDEVMODE: "1"
  # サプライチェーン攻撃対策: uvがlockfileを尊重する
  UV_FROZEN: "1"

jobs:
  # pyfltr自身を公開する配布物の検査。利用者向けの品質チェック設定例には含めない。
  distribution:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: uv sync --all-groups --all-extras
      - name: 配布物の独立環境検査
        run: uv run pyfltr ci --commands=distribution-check --enable=distribution-check --no-cache --output-format=github-annotations

  pnpx-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pnpm-version: ["10.0.0", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          # 同一pushで先行するDocsと両matrixが同じキーを保存するとreservation警告になるため、
          # 小規模な互換性jobではキャッシュを無効化する。
          enable-cache: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ matrix.pnpm-version }}

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Test markdownlint with pnpx runner
        env:
          CI: "true"
        run: uv run pyfltr run tests/integration/smoke_test.py --commands=pytest --no-fix --no-archive --no-cache "--pytest-args=-k=test_tool_smoke[markdownlint]"

      - name: Test textlint with pnpx runner
        env:
          CI: "true"
        run: uv run pyfltr run tests/integration/smoke_test.py --commands=pytest --no-fix --no-archive --no-cache "--pytest-args=-k=test_tool_smoke[textlint]"

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ak110/pyfltr:latest
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      # mise等がGitHub APIを呼び出す際のレート制限（403）回避
      # container jobでは明示しないとsecrets.GITHUB_TOKENがコンテナへ渡らない
      GITHUB_TOKEN: ${{ github.token }}
      # 実行アーカイブの保存先。container job配下では$HOMEがGitHub Actionsに上書きされ
      # 不安定になるため（docker/Dockerfileの既存コメント参照）、$HOME非依存の固定絶対パスを使う。
      # 依存キャッシュ（/cache配下）とは別パスとし、actions/cacheの対象へ混入させない。
      PYFLTR_CACHE_DIR: /tmp/pyfltr-ci-archive
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # 固定旧版との実行枠共存試験が過去commitの実装を読むため、全履歴を取得する。
        with:
          fetch-depth: 0

      - name: 利用者設定に依存しないロック検証
        if: ${{ matrix.python-version == '3.11' }}
        run: |
          set -euo pipefail
          config_dir="$(mktemp -d)"
          trap 'rmdir "$config_dir"' EXIT
          # UV_FROZENではlockfileの最新性を検査しないため、この検査だけ解除する。
          env --unset=UV_FROZEN XDG_CONFIG_HOME="$config_dir" uv lock --check

      # キャッシュのキーへ使う、イメージが同梱するpyfltrの版。イメージが同梱するツール群はこの版で決まる。
      # 版の表示を標準エラーへ書く旧版のイメージでも取り出せるよう、両方を受け取る。
      - name: イメージ同梱のpyfltrの版
        id: image
        run: |
          set -euo pipefail
          output="$(pyfltr --version 2>&1)"
          version="$(printf '%s\n' "$output" | sed -n 's/^pyfltr \([0-9][0-9A-Za-z.+-]*\)$/\1/p')"
          if [ -z "$version" ]; then
            echo "::error::イメージ同梱のpyfltrの版を取り出せない（pyfltr --versionの出力: ${output}）。出力の形式が変わった場合は、このステップの抽出処理を出力に合わせて直す"
            exit 1
          fi
          echo "pyfltr-version=${version}" >> "$GITHUB_OUTPUT"

      # キャッシュなしの計測（2026年11月）では、ジョブが/cacheへ加えるのはmise（smoke testのツール導入、約208MB）と
      # uv（プロジェクトの依存、約229MB）で、pnpmは増えなかった。uvの増分はPyPIから短時間で取得でき、
      # /cache/uvを保存するとイメージ同梱分（約845MB）まで毎回アーカイブし直すため、/cache/miseだけを保存する。
      # キーは内容を決める入力（イメージのpyfltrの版と設定）のハッシュとし、restore-keysを置かない。
      # 入力が同じ実行は完全一致で復元して保存を省き、イメージの更新後は新しいキーで同梱ツールから作り直す。
      # 内容はPythonの版に依存しないため、保存は全検査を担う版のジョブだけが行い、同じキーの保存の競合を避ける。
      - name: Restore /cache/mise
        id: mise-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /cache/mise
          key: pyfltr-mise-${{ runner.os }}-${{ steps.image.outputs.pyfltr-version }}-${{ hashFiles('pyproject.toml', 'mise.toml') }}

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      # 静的解析はPythonの版により結果が変わり得るが、対応版ごとに重複実行すると所要時間が版数に比例して増える。
      # 最新安定版（3.15）を基準とし、対象の版だけで全検査を実行する。
      # 他の版は`tokenize`・`ast`等の版差を検証するpytestだけを実行する。
      # 対応版を追加・変更する場合は、全検査を実行する版が1つだけになるよう両ステップの条件を更新する。
      - name: Test with pyfltr (全検査)
        if: ${{ matrix.python-version == '3.15' }}
        # `CI=true` を明示し、smoke test がツール不在時にスキップせず失敗扱いとなるようにする。
        env:
          CI: "true"
        run: uv run pyfltr ci --output-format=github-annotations

      - name: Test with pyfltr (pytestのみ)
        if: ${{ matrix.python-version != '3.15' }}
        env:
          CI: "true"
        run: uv run pyfltr ci --commands=pytest --output-format=github-annotations

      - name: Save /cache/mise
        if: ${{ matrix.python-version == '3.15' && steps.mise-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /cache/mise
          key: ${{ steps.mise-cache.outputs.cache-primary-key }}

      - name: 失敗時に実行アーカイブを成果物として保存
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyfltr-archive-${{ runner.os }}-py${{ matrix.python-version }}
          path: ${{ env.PYFLTR_CACHE_DIR }}/runs
          retention-days: 7

      - name: Prune uv cache for CI
        run: uv cache prune --ci

  test-windows:
    runs-on: windows-latest
    env:
      # mise等がGitHub APIを呼び出す際のレート制限（403）回避。
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # 固定旧版との実行枠共存試験が過去commitの実装を読むため、全履歴を取得する。
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest

      - name: Configure pnpm security
        run: pnpm config set minimum-release-age 1440 --global

      - name: Configure pnpm store location
        # `pnpm store path`はcwdのドライブ（ルート）に依存して決まる。
        # チェックアウト先はDドライブ、pytestの一時ディレクトリはCドライブのため、
        # 明示しないとキャッシュ対象パスとテスト実行時の使用パスが別ドライブへ分裂し、
        # ストアが保存されないまま毎回ダウンロードが発生する。
        run: pnpm config set store-dir "${{ runner.temp }}\pnpm-store" --global

      - name: Get pnpm store path
        id: pnpm-store-win
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store-win.outputs.STORE_PATH }}
          # ストアの内容はpyfltrがpnpx経由で起動するツールの指定で決まるため、その入力のハッシュをキーにする。
          # 入力が同じ実行は完全一致で復元して保存を省く。restore-keysで古い内容を引き継ぐと
          # 内容アドレス型のストアに不要な版が累積し続けるため、入力が変わった実行は空から作り直す。
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', 'pyfltr/config/model.py') }}

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: 実行アーカイブの保存先を設定
        # `runner`コンテキストはジョブ直下`env`から参照できないため、ステップの`run`内で
        # 解決してGITHUB_ENV経由で後続ステップへ引き渡す（Get pnpm store pathと同じ方式）。
        # 同ジョブのpnpm store設定（89-94行）と同じrunner.temp起点で、ホストランナー
        # 直接実行のため確実に利用可能。
        shell: bash
        run: echo "PYFLTR_CACHE_DIR=${{ runner.temp }}/pyfltr-cache" >> "$GITHUB_ENV"

      - name: Install smoke test tooling via mise
        # tests/integration/smoke_test.py が起動するmise経由ツールをWindows runnerでも揃える。
        # Linux jobは公式pyfltrイメージに同梱済みのため不要。
        # 既定シェル（PowerShell）でもbash継続`\`に依存せず動くよう単一行で記述する。
        run: mise use --global shfmt@latest actionlint@latest pinact@latest github:editorconfig-checker/editorconfig-checker@latest taplo@latest hadolint@latest gitleaks@latest

      - name: Install shellcheck via chocolatey
        # shellcheckはmise registryでもインストールできるが、Windowsではzip内サブディレクトリ
        # （shellcheck-vX.Y.Z\shellcheck.exe）構造に対応せず`mise exec`でバイナリを解決できない。
        # windows-latestに同梱のchocolateyで直接配置してPATH上の素のバイナリとして利用する。
        run: choco install -y shellcheck

      - name: Install smoke test tooling via uv
        # いずれもpyfltr本体依存に含まれるが、smoke testでのPATH解決を
        # 確実にするためWindows runnerへ個別に導入する。
        run: |
          uv tool install yamllint
          uv tool install typos
          uv tool install pre-commit
          uv tool install prek

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Test with pyfltr
        # `CI=true` を明示し、smoke test がツール不在時にスキップせず失敗扱いとなるようにする。
        env:
          CI: "true"
        run: uv run pyfltr ci --output-format=github-annotations

      - name: 失敗時に実行アーカイブを成果物として保存
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyfltr-archive-${{ runner.os }}
          path: ${{ env.PYFLTR_CACHE_DIR }}/runs
          retention-days: 7

      - name: Prune uv cache for CI
        run: uv cache prune --ci
