name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: バージョン番号の更新タイプ
        required: true
        type: choice
        options:
          - PATCH
          - MINOR
          - MAJOR
        default: PATCH

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Require release dispatch from master
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "Releaseはmasterブランチを選んで実行してください。" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          commit_sha="$(git rev-parse HEAD)"
          echo "Checking CI result for commit: ${commit_sha}"

          # 最大待機時間 (秒): 30 分
          max_wait=1800
          wait_interval=30
          elapsed=0

          while [ "${elapsed}" -lt "${max_wait}" ]; do
            # ci.yaml ワークフローの最新の実行結果を取得
            workflow_runs="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/actions/workflows/ci.yaml/runs?branch=master&head_sha=${commit_sha}&per_page=1")"

            total_count="$(echo "${workflow_runs}" | jq -r '.total_count')"
            if [ "${total_count}" = "0" ]; then
              echo "No CI workflow found for sha=${commit_sha}. Waiting..."
              sleep "${wait_interval}"
              elapsed="$((elapsed + wait_interval))"
              continue
            fi

            status="$(echo "${workflow_runs}" | jq -r '.workflow_runs[0].status')"
            conclusion="$(echo "${workflow_runs}" | jq -r '.workflow_runs[0].conclusion')"
            echo "Current status: ${status}, conclusion: ${conclusion}"

            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" = "success" ]; then
                echo "CI passed successfully"
                exit 0
              fi
              echo "CIが成功していません（conclusion: ${conclusion}）。CIの指摘を修正して成功を確認し、リリースを再実行してください。"
              exit 1
            fi

            echo "CI is still running. Waiting ${wait_interval}s..."
            sleep "${wait_interval}"
            elapsed="$((elapsed + wait_interval))"
          done

          echo "CIの完了を待つ時間が上限に達しました。CIの成功を確認してリリースを再実行してください。"
          exit 1

      - name: Calculate next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # 再実行時の冪等性: HEAD を指すリリースタグが既にあれば再利用
          existing_tag="$(git tag --points-at=HEAD --sort=-version:refname |
            awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found=1 }')"
          if [ -n "${existing_tag}" ]; then
            echo "HEADの既存タグ ${existing_tag} を再利用します。再実行時の処理のため対応不要です。"
            echo "next=${existing_tag}" >> "$GITHUB_OUTPUT"
            echo "version=${existing_tag#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # HEAD にタグがなければ、latest からインクリメント
          latest="$(git tag --sort=-version:refname |
            awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found=1 }')"
          if [[ -z "$latest" ]] || ! git merge-base --is-ancestor "refs/tags/$latest" HEAD; then
            echo "現在のリリースタグより新しいコミットをmasterで選んでReleaseを起動してください。" >&2
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            'PATCH') ((++patch));;
            'MINOR') ((++minor)); patch=0;;
            'MAJOR') ((++major)); minor=0; patch=0;;
            *) echo "Unknown bump: '$BUMP'" >&2; exit 1;;
          esac
          echo "next=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      # PyPI publish ・ タグ作成前に Dockerfile が構造的に build できることを検証する。
      # PYFLTR_VERSION 未指定で実行するため PyPI 上の最新公開版 (= 今回リリース対象の
      # 1 つ前のバージョン) で build を試行する。新リリース版固有の問題は検出できないが、
      # ベースイメージ消失・APT パッケージ削除・Dockerfile 構文エラー等の構造起因事故を
      # PyPI publish 前に止められる (publish 後の失敗は手動リカバリーが必要なため)。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Pre-flight Docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          secrets: |
            GITHUB_TOKEN=${{ github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true

      # 配布物検査はmarkdownlintの修正済み依存をpnpmで取得するため、CIのdistributionジョブ（公式イメージ）と同じくNode.jsとpnpmを用意する。
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: latest

      # タグ作成前に候補版を指定してビルドし、検査した同じ配布物を公開する。
      # 本リポジトリ固有の配布工程であり、利用者向けCI設定例には含めない。
      - name: Build release candidates
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.next.outputs.version }}
        run: uv build --no-sources --clear

      - name: 配布物の独立環境検査
        env:
          PYFLTR_DISTRIBUTION_DIR: ${{ github.workspace }}/dist
        run: uv run --frozen pyfltr ci --commands=distribution-check --enable=distribution-check --no-cache --output-format=github-annotations

      - name: Create tag and push
        env:
          TAG: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if tagged_commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}" 2>/dev/null)"; then
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "タグ $TAG がRelease起動時と異なるコミットを指しています。タグと起動時のコミットを確認してください。" >&2
              exit 1
            fi
            echo "起動時のコミットを指す既存タグ $TAG を再利用します。"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Publish verified distributions to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          uv publish --check-url=https://pypi.org/simple/ dist/pyfltr-*.whl dist/pyfltr-*.tar.gz

      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --current --strip header
        env:
          OUTPUT: CHANGES.md

      - name: Append changelog link
        env:
          TAG: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          prev_tag="$(git tag --merged "refs/tags/$TAG^" --sort=-version:refname |
            awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found { print; found=1 }')"
          printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
            "$GITHUB_REPOSITORY" "$prev_tag" "$TAG" >> CHANGES.md

      - name: Publish GitHub Release with verification instructions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.next }}
        run: |
          set -euo pipefail
          instructions="$(cat <<EOF
          ## コンテナイメージの署名とソースコミットを検証する

          GitHub Releaseの公開後にコンテナイメージを公開します。
          イメージの公開後、\`gh auth login\`または\`GH_TOKEN\`でGitHub CLIを認証してから、
          次のコマンドで署名したワークフローと公開タグのコミットを照合できます。

          \`\`\`shell
          source_sha="\$(gh api repos/ak110/pyfltr/commits/$TAG --jq .sha)" &&
          gh attestation verify oci://ghcr.io/ak110/pyfltr:$TAG \\
            --repo ak110/pyfltr \\
            --signer-workflow ak110/pyfltr/.github/workflows/docker-build.yaml \\
            --source-digest "\$source_sha"
          \`\`\`

          証明が示すのはDockerfileを取得したコミットです。通常の公開ではリリースタグが指すコミットと一致します。
          手動でイメージを再ビルドした場合は、Docker Buildの実行IDを使い、
          1行目の \`gh api ...\` を \`gh run view RUN_ID --json headSha --jq .headSha --repo ak110/pyfltr\` に置き換えてください。
          コミットの取得や検証に失敗した場合、来歴は確認できていません。
          この証明は、イメージに同梱するPyPI配布物のビルド元を証明するものではありません。
          [来歴証明の一覧](https://github.com/ak110/pyfltr/attestations)
          EOF
          )"

          if body="$(gh release view "$TAG" --json body --jq .body)"; then
            if [[ "$body" == *"$instructions"* ]]; then
              exit 0
            fi
            printf '%s\n\n%s\n' "$body" "$instructions" > CHANGES.md
            gh release edit "$TAG" --notes-file=CHANGES.md
          else
            printf '\n%s\n' "$instructions" >> CHANGES.md
            gh release create "$TAG" --title="$TAG" --verify-tag --notes-file=CHANGES.md
          fi

      - name: Prune uv cache for CI
        run: uv cache prune --ci

  # GitHub Container Registry へ pyfltr 同梱 Docker イメージを publish する。
  # 最新のリリースを公開する場合は版タグとlatestを更新し、旧版を補完する場合は版タグだけを更新する。
  # Docker build / push と PyPI 配信エッジ伝搬待ち・初回 build 失敗時の再試行ロジックは
  # ``docker-build.yaml`` 側に集約する。CI 修復用の単発再ビルドにも同 workflow を利用する。
  docker-publish:
    needs: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/docker-build.yaml
    with:
      version: ${{ needs.release.outputs.version }}
