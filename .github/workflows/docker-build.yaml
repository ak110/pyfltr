name: Docker Build

on:
  workflow_call:
    inputs:
      version:
        description: "PyPIバージョン番号（例: 0.16.0）。空のときはPyPIから最新公開版を取得する。"
        required: false
        type: string
        default: ""
      protect_latest:
        description: "リリース用。新しいリリースタグがある場合はlatestを更新しない。"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: "PyPIバージョン番号（例: 0.16.0）。空のときはPyPIから最新公開版を取得する。"
        required: false
        type: string
        default: ""

concurrency:
  group: docker-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # ``docker/build-push-action`` で ``context: docker`` を解決するため、
      # 別ワークフローとして独立実行される本ファイルでも先にチェックアウトする。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Resolve PyPI version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          input_version="${INPUT_VERSION}"
          if [ -z "${input_version}" ]; then
            echo "Input version is empty; fetching latest pyfltr version from PyPI"
            input_version="$(curl -fsSL "https://pypi.org/pypi/pyfltr/json" | jq -r '.info.version')"
            if [ -z "${input_version}" ] || [ "${input_version}" = "null" ]; then
              echo "PyPIから最新のpyfltrの版を取得できませんでした。ActionsのRun workflowでversion入力を明示して再実行してください。" >&2
              exit 1
            fi
          fi
          version="${input_version#v}"
          if [[ ! "$version" =~ ^[0-9][0-9A-Za-z_.-]{0,126}$ ]]; then
            echo "Dockerタグに使えるPyPI版を指定してください（例: 3.35.0）。" >&2
            exit 1
          fi
          echo "Resolved version: ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `uv publish --check-url` 直後でも PyPI 配信エッジ (Fastly) のキャッシュ反映には
      # ラグがあり、Docker build 内の `uv tool install pyfltr==X.Y.Z` が
      # 「No solution found」で失敗する事象が継続発生したため、Docker build 直前に
      # 同等条件 (clean cache) で解決可能になるまで polling する。
      # extras (`[python]`) 込みで解決確認することで、Docker build と同じ要求形を検証する。
      # 利用者向けコマンド `uv run --with="pyfltr[python]" pyfltr` の解決可能性も間接的に確認できる。
      # さらに ``required_consecutive`` 回連続成功するまで待つことで、
      # 単発でエッジを掴んだ瞬間だけ通る揺らぎを排除する。
      - name: Wait for PyPI propagation
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION}"
          required_consecutive=3
          success_count=0
          for i in $(seq 1 60); do
            if uv tool install --reinstall --no-cache "pyfltr[python]==${version}" >/dev/null 2>&1; then
              success_count=$((success_count + 1))
              echo "Attempt ${i}/60: pyfltr[python]==${version} resolvable (${success_count}/${required_consecutive})"
              uv tool uninstall pyfltr >/dev/null 2>&1 || true
              if [ "${success_count}" -ge "${required_consecutive}" ]; then
                echo "pyfltr[python]==${version} is stably installable from PyPI"
                exit 0
              fi
            else
              if [ "${success_count}" -gt 0 ]; then
                echo "Attempt ${i}/60: resolution flapped, resetting consecutive counter"
              else
                echo "Attempt ${i}/60: pyfltr[python]==${version} not yet resolvable"
              fi
              success_count=0
            fi
            sleep 10
          done
          echo "PyPIでのpyfltr[python]==${version}の公開反映を待つ時間が上限に達しました。時間をおいてActionsのRe-run jobsで再実行してください。" >&2
          exit 1

      - name: Select image tags
        id: tags
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PROTECT_LATEST: ${{ inputs.protect_latest }}
        run: |
          set -euo pipefail
          publish_latest=true
          if [[ "$PROTECT_LATEST" == true ]]; then
            newest_tag="$(git ls-remote --tags --refs --sort=-v:refname origin 'v*' |
              awk '$2 ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+$/ && !found { sub(/^refs\/tags\//, "", $2); print $2; found=1 }')"
            if [[ -z "$newest_tag" ]]; then
              echo "最新のリリースタグを取得できませんでした。GitHub上のタグを確認してください。" >&2
              exit 1
            fi
            if [[ "$newest_tag" != "$TAG" ]]; then
              echo "$TAG のみを更新し、latestは更新しません（最新のリリースタグ: $newest_tag）。"
              publish_latest=false
            fi
          fi
          {
            printf 'list<<EOF\nghcr.io/ak110/pyfltr:%s\n' "$TAG"
            if [[ "$publish_latest" == true ]]; then
              printf 'ghcr.io/ak110/pyfltr:latest\n'
            fi
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      # Wait for PyPI propagation を通過しても Docker builder ホストが別エッジを掴んで
      # 「No solution found」になる事象が稀に残るため、初回失敗時のみ短い間を空けて再試行する。
      # 1 回目失敗時は ``continue-on-error`` でエラーを無視し、再試行 step が結果を引き取る。
      - name: Build and push Docker image
        id: docker_build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            PYFLTR_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          secrets: |
            GITHUB_TOKEN=${{ github.token }}

      - name: Wait before Docker build retry
        if: steps.docker_build.outcome == 'failure'
        run: |
          echo "初回のDockerビルドに失敗しました。30秒後に自動で再試行するため対応不要です。"
          sleep 30

      - name: Build and push Docker image (retry)
        id: docker_retry
        if: steps.docker_build.outcome == 'failure'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            PYFLTR_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.tags.outputs.list }}
          secrets: |
            GITHUB_TOKEN=${{ github.token }}

      - name: Select published image digest
        id: published
        env:
          FIRST_OUTCOME: ${{ steps.docker_build.outcome }}
          FIRST_DIGEST: ${{ steps.docker_build.outputs.digest }}
          RETRY_DIGEST: ${{ steps.docker_retry.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$FIRST_OUTCOME" == success ]]; then
            digest="$FIRST_DIGEST"
          else
            digest="$RETRY_DIGEST"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "pushしたイメージのdigestを取得できませんでした。Docker Buildを再実行してください。" >&2
            exit 1
          fi
          printf 'Published image digest: %s\n' "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/ak110/pyfltr
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
